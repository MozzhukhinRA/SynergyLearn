<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Счётчик</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="counter">
        <h1>Счётчик</h1>
        <div id="result" class="result zero">0</div>
        <div class="buttons">
            <button id="minusButton" type="button">Минус</button>
            <button id="plusButton" type="button">Плюс</button>
        </div>
        <div id="message" class="message"></div>
    </main>
    <script src="script.js"></script>
</body>
</html>
